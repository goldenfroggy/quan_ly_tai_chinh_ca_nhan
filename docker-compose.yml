services:
  postgres:
    image: postgres:16
    container_name: finance-postgres
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: finance-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://finance_user:finance_password@postgres:5432/finance_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
